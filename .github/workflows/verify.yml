# 푸시와 PR 마다 엔진 검사와 화면 점검을 돌린다. 로컬에서 쓰는 것과 같은 `npm run verify` 다.
# 배포하지 않고 시크릿도 넘기지 않는다.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 설치
        run: npm ci
      # 러너에는 한글 글꼴이 없다. 글자 폭이 실제와 달라지면 가로 넘침 검사가 엉뚱하게 나온다.
      - name: 한글 글꼴
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      # 러너에 깔려 있는 구글 크롬을 쓴다. playwright-core 는 브라우저를 따로 받지 않는다.
      - name: 검사
        env:
          CHROMIUM: /usr/bin/google-chrome
        run: npm run verify
