# Cloudflare Pages 에 배포한다. 손으로 돌릴 때만 돌고(workflow_dispatch), main 에서만 올린다.
# 배포는 건마다 의뢰인 승인을 받는다(CLAUDE.md). 처음 한 번 할 일과 시크릿은 docs/배포.md 에 적었다.
# 올리기 전에 verify 와 같은 `npm run verify` 를 다시 돌린다.
name: deploy

on:
  workflow_dispatch:
    inputs:
      create_project:
        description: "Pages 프로젝트를 처음 만들 때만 켠다"
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PROJECT: gihanjigi
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: 시크릿 확인
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then echo "::error::시크릿 ${name} 이 없습니다. docs/배포.md 를 보세요."; exit 1; fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 설치
        run: npm ci
      # 러너에는 한글 글꼴이 없다. 글자 폭이 실제와 달라지면 가로 넘침 검사가 엉뚱하게 나온다.
      - name: 한글 글꼴
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: 검사
        env:
          CHROMIUM: /usr/bin/google-chrome
        run: npm run verify
      # wrangler 판을 고정한다. src 를 빌드 없이 그대로 올리고, 헤더는 src/_headers 가 붙인다.
      - name: wrangler 설치
        run: npm install -g --no-audit --no-fund wrangler@4.138.0
      - name: 프로젝트 만들기
        if: inputs.create_project
        run: wrangler pages project create "$PROJECT" --production-branch=main
      - name: 배포
        run: |
          set -o pipefail
          wrangler pages deploy src --project-name="$PROJECT" --branch=main \
            --commit-hash="$GITHUB_SHA" --commit-message="$(git log -1 --format=%s)" | tee deploy.log
          url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          echo "배포한 주소: ${url}" >> "$GITHUB_STEP_SUMMARY"
