# Vercel 에 배포한다. 손으로 돌릴 때만 돌고(workflow_dispatch), main 에서만 올린다.
# 배포는 건마다 의뢰인 승인을 받는다(CLAUDE.md). 처음 한 번 할 일과 시크릿은 docs/배포.md 에 적었다.
# 올리기 전에 verify 와 같은 `npm run verify` 를 다시 돌린다.
name: deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TELEMETRY_DISABLED: "1"
    steps:
      - name: 시크릿 확인
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then echo "::error::시크릿 ${name} 이 없습니다. docs/배포.md 를 보세요."; exit 1; fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 설치
        run: npm ci
      # 러너에는 한글 글꼴이 없다. 글자 폭이 실제와 달라지면 가로 넘침 검사가 엉뚱하게 나온다.
      - name: 한글 글꼴
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: 검사
        env:
          CHROMIUM: /usr/bin/google-chrome
        run: npm run verify
      # CLI 판을 고정한다. vercel.json 이 src 를 빌드 없이 그대로 올리고 보안 헤더를 붙인다.
      - name: 배포
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm install -g --no-audit --no-fund vercel@59.26.0
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "배포한 주소: ${url}" >> "$GITHUB_STEP_SUMMARY"
